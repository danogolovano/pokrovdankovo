<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Храм Покрова Пресвятой Богородицы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            background: #f5efe6;
            padding: 16px;
            color: #2c1810;
            min-height: 100vh;
        }
        .note-card {
            max-width: 500px;
            margin: 0 auto;
            background: #fcf8f0;
            border: 2px solid #c9ad7a;
            border-radius: 12px;
            padding: 28px 24px 32px;
            box-shadow: 0 8px 32px rgba(44,24,16,0.15);
        }
        .note-card::before {
            content: "✠ ✠ ✠";
            display: block;
            text-align: center;
            font-size: 20px;
            color: #b8944c;
            letter-spacing: 8px;
            margin-bottom: 12px;
        }
        .note-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            border-bottom: 2px solid #c9ad7a;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
        .note-title span { color: #b8944c; }
        .note-subtitle {
            text-align: center;
            font-size: 14px;
            color: #8a7a6a;
            margin-bottom: 18px;
        }
        .field-group {
            margin-bottom: 18px;
        }
        .field-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #5a3e2b;
            margin-bottom: 5px;
        }
        .field-group select,
        .field-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            background: white;
            color: #2c1810;
        }
        .field-group select:focus,
        .field-group input:focus {
            outline: none;
            border-color: #b8944c;
            box-shadow: 0 0 0 3px rgba(184,148,76,0.2);
        }
        .names-container { margin: 16px 0 10px; }
        .name-input-wrapper {
            margin-bottom: 8px;
            position: relative;
        }
        .name-input-wrapper input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid #d4c4a8;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            background: white;
        }
        .name-input-wrapper input:focus {
            outline: none;
            border-color: #b8944c;
            box-shadow: 0 0 0 3px rgba(184,148,76,0.15);
        }
        .name-input-wrapper .number {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #b8944c;
            font-weight: bold;
            font-size: 14px;
        }
        .name-input-wrapper .number::before {
            content: "✟";
            margin-right: 4px;
            font-size: 12px;
        }
        .hint-text {
            font-size: 13px;
            color: #8a7a6a;
            font-style: italic;
            text-align: center;
        }
        .buttons-row {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .btn-primary {
            background: #b8944c;
            color: white;
        }
        .btn-primary:hover {
            background: #a07d3a;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #e8ddd0;
            color: #5a3e2b;
        }
        .btn-secondary:hover { background: #dccfc0; }
        .btn-admin {
            background: #2c1810;
            color: #c9ad7a;
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #c9ad7a;
            cursor: pointer;
        }
        .btn-admin:hover { background: #4a2a1f; }
        .admin-panel {
            max-width: 600px;
            margin: 30px auto 0;
            background: #fcf8f0;
            border: 2px solid #c9ad7a;
            border-radius: 12px;
            padding: 24px;
            display: none;
        }
        .admin-panel.active { display: block; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            border-bottom: 2px solid #c9ad7a;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .admin-header h2 { font-size: 20px; color: #2c1810; }
        .date-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .date-tab {
            padding: 6px 16px;
            border: 1px solid #d4c4a8;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Georgia', serif;
            transition: all 0.3s;
        }
        .date-tab:hover { background: #f5efe6; }
        .date-tab.active {
            background: #b8944c;
            color: white;
            border-color: #b8944c;
        }
        .service-section {
            background: #f5efe6;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .service-section h4 {
            color: #5a3e2b;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .service-section .price-tag {
            font-size: 13px;
            color: #b8944c;
            font-weight: normal;
        }
        .service-section .names-list {
            list-style: none;
            padding: 0;
        }
        .service-section .names-list li {
            padding: 4px 0 4px 20px;
            border-bottom: 1px dashed #ddd0c0;
            font-size: 15px;
            position: relative;
        }
        .service-section .names-list li::before {
            content: "✟";
            position: absolute;
            left: 0;
            color: #b8944c;
            font-size: 12px;
        }
        .copy-btn {
            background: none;
            border: 1px solid #c9ad7a;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            color: #5a3e2b;
            margin-top: 6px;
            font-family: 'Georgia', serif;
        }
        .copy-btn:hover {
            background: #c9ad7a;
            color: white;
        }
        .message {
            padding: 14px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
            font-size: 15px;
            display: none;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2d7d46;
            border: 1px solid #a5d6a7;
        }
        .message.error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .message.info {
            display: block;
            background: #e3f2fd;
            color: #0d47a1;
            border: 1px solid #90caf9;
        }
        #priceDisplay {
            text-align: center;
            margin: 8px 0;
            font-size: 15px;
            color: #5a3e2b;
        }
        .mode-toggle {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #d4c4a8;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fcf8f0;
            border: 2px solid #c9ad7a;
            border-radius: 12px;
            padding: 28px 24px 32px;
            max-width: 440px;
            width: 90%;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-box .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            cursor: pointer;
            color: #8a7a6a;
            background: none;
            border: none;
        }
        .modal-box h2 {
            text-align: center;
            color: #2c1810;
            margin-bottom: 16px;
        }
        .payment-section {
            background: #f5efe6;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #d4c4a8;
        }
        .payment-section h3 {
            color: #2c1810;
            font-size: 18px;
            margin-bottom: 12px;
            text-align: center;
        }
        .payment-details {
            font-size: 13px;
            line-height: 1.8;
            color: #3a2a1a;
        }
        .payment-details .label {
            font-weight: bold;
            color: #5a3e2b;
        }
        .payment-total {
            text-align: center;
            font-size: 22px;
            color: #b8944c;
            margin: 12px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 1px solid #c9ad7a;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #8a7a6a;
        }
        @media (max-width: 480px) {
            .note-card { padding: 20px 16px 24px; }
            .buttons-row { flex-direction: column; }
            .btn { padding: 12px; }
            .admin-panel { padding: 16px; }
        }
    </style>
</head>
<body>

<!-- ===== ОСНОВНАЯ КАРТОЧКА ===== -->
<div id="userMode" class="note-card">
    <div class="note-title">🕯️ Подача <span>записки</span></div>
    <div class="note-subtitle">
        Храм в честь Покрова Пресвятой Богородицы<br>
        с. Данково, Каширский район, Воронежская область
    </div>
    
    <div class="field-group">
        <label>📅 Дата службы</label>
        <select id="serviceDate" onchange="window.loadServiceTypes()">
            <option value="">— загрузка дат... —</option>
        </select>
    </div>
    
    <div class="field-group">
        <label>✝️ Вид поминовения</label>
        <select id="serviceType" onchange="window.updatePrice()">
            <option value="">— сначала выберите дату —</option>
        </select>
    </div>
    
    <div class="field-group">
        <label>👤 Имена для поминовения</label>
        <div class="names-container" id="namesContainer"></div>
        <div class="hint-text">✟ Начните вводить имя — появится следующее поле ✟</div>
    </div>
    
    <div id="priceDisplay">Цена: 0 ₽</div>
    
    <div class="buttons-row">
        <button class="btn btn-primary" onclick="window.submitWithPayment()">💰 К оплате</button>
        <button class="btn btn-secondary" onclick="window.submitWithoutPayment()">🙏 Отправить</button>
    </div>
    
    <div id="userMessage" class="message"></div>
</div>

<!-- ===== АДМИН-ПАНЕЛЬ ===== -->
<div id="adminMode" class="admin-panel">
    <div class="admin-header">
        <h2>📋 Управление записками</h2>
        <button class="btn-admin" onclick="window.refreshAdminData()">🔄 Обновить</button>
    </div>
    <div class="date-tabs" id="dateTabs"></div>
    <div id="adminContent">
        <p style="color:#8a7a6a; text-align:center; padding:20px;">Выберите дату</p>
    </div>
    <div style="margin-top:20px; border-top:1px solid #d4c4a8; padding-top:16px;">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn-admin" onclick="window.openAddDateModal()">➕ Добавить дату</button>
            <button class="btn-admin" onclick="window.openAddServiceTypeModal()">➕ Добавить вид</button>
            <button class="btn-admin" onclick="window.manageDateServices()">📌 Назначить виды</button>
        </div>
    </div>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="close-btn" onclick="window.closeModal()">✕</button>
        <h2 id="modalTitle">Заголовок</h2>
        <div id="modalBody"></div>
    </div>
</div>

<!-- ===== ПЕРЕКЛЮЧАТЕЛЬ ===== -->
<div class="mode-toggle">
    <button id="toggleModeBtn" class="btn-admin" onclick="window.toggleMode()">
        🔐 Вход для администратора
    </button>
</div>

<!-- ===== ИСПОЛЬЗУЕМ IMPORT MAP ДЛЯ SUPABASE ===== -->

<!-- ===== ОСНОВНОЙ КОД ===== -->
<script type="module">
// ================================================================
// 1. НАСТРОЙКИ SUPABASE — ВСТАВЬТЕ СВОИ ДАННЫЕ!
// ================================================================

import { createClient } from '@supabase/supabase-js';

const SUPABASE_URL = 'https://fupntgnmagobmpjqrbbf.supabase.co';      // ← ЗАМЕНИТЕ
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1cG50Z25tYWdvYm1wanFyYmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwODU2NjksImV4cCI6MjA1OTY2MTY2OX0.hVY1LYXaQibJ4y2DJ6agG5sxTHe_wr2-HqW9oSvcKmc';                       // ← ЗАМЕНИТЕ

console.log('🔍 Проверка: SUPABASE_URL =', SUPABASE_URL);
console.log('🔍 Проверка: SUPABASE_KEY =', SUPABASE_KEY ? '✅ Ключ установлен' : '❌ Ключ отсутствует');

// Инициализация Supabase
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
console.log('✅ Supabase инициализирован');

// Делаем supabase доступным глобально для других функций
window.supabase = supabase;

// ================================================================
// 2. ПЕРЕМЕННЫЕ
// ================================================================

let nameCounter = 0;
let currentPricePerName = 0;
const ADMIN_PASSWORD = 'admin123'; // ← СМЕНИТЕ ПАРОЛЬ!

// ================================================================
// 3. УПРАВЛЕНИЕ ПОЛЯМИ ДЛЯ ИМЁН
// ================================================================

function addNameField() {
    nameCounter++;
    const container = document.getElementById('namesContainer');
    const wrapper = document.createElement('div');
    wrapper.className = 'name-input-wrapper';
    wrapper.id = 'nameWrapper_' + nameCounter;
    
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Имя (например: Сергий)';
    input.id = 'name_' + nameCounter;
    input.autocomplete = 'off';
    
    input.addEventListener('input', function() {
        const nextWrapper = wrapper.nextElementSibling;
        if (nextWrapper) {
            const nextInput = nextWrapper.querySelector('input');
            if (nextInput && nextInput.value.trim() === '') {
                nextWrapper.remove();
            }
        }
        if (this.value.trim() !== '') {
            const nextExists = wrapper.nextElementSibling;
            if (!nextExists) {
                const allInputs = container.querySelectorAll('input');
                let hasEmpty = false;
                allInputs.forEach(inp => {
                    if (inp.value.trim() === '') hasEmpty = true;
                });
                if (!hasEmpty) {
                    addNameField();
                }
            }
        }
        updatePrice();
    });
    
    wrapper.appendChild(input);
    container.appendChild(wrapper);
    if (nameCounter === 1) input.focus();
}

function getAllNames() {
    const container = document.getElementById('namesContainer');
    const inputs = container.querySelectorAll('input');
    const names = [];
    inputs.forEach(inp => {
        const val = inp.value.trim();
        if (val !== '') names.push(val);
    });
    return names;
}

function clearNameFields() {
    const container = document.getElementById('namesContainer');
    container.innerHTML = '';
    nameCounter = 0;
    addNameField();
}

// ================================================================
// 4. РАСЧЁТ ЦЕНЫ
// ================================================================

function updatePrice() {
    const names = getAllNames();
    const count = names.length;
    const price = count * currentPricePerName;
    document.getElementById('priceDisplay').textContent = 
        `Цена: ${price} ₽ (${count} имён × ${currentPricePerName} ₽)`;
    return { count, price };
}

// ================================================================
// 5. ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
// ================================================================

async function loadServiceDates() {
    const select = document.getElementById('serviceDate');
    select.innerHTML = '<option value="">— загрузка... —</option>';
    
    try {
        console.log('🔄 Загрузка дат...');
        const { data, error } = await supabase
            .from('service_dates')
            .select('*')
            .order('date', { ascending: true });
        
        if (error) {
            console.error('❌ Ошибка загрузки дат:', error);
            select.innerHTML = '<option value="">❌ Ошибка загрузки</option>';
            showMessage('userMessage', 'Ошибка загрузки дат: ' + error.message, 'error');
            return;
        }
        
        console.log('✅ Загружено дат:', data?.length || 0);
        select.innerHTML = '<option value="">— выберите дату —</option>';
        data.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = formatDate(d.date);
            opt.dataset.date = d.date;
            select.appendChild(opt);
        });
    } catch (e) {
        console.error('❌ Ошибка:', e);
        select.innerHTML = '<option value="">❌ Ошибка</option>';
        showMessage('userMessage', 'Ошибка: ' + e.message, 'error');
    }
}

async function loadServiceTypes() {
    const dateSelect = document.getElementById('serviceDate');
    const typeSelect = document.getElementById('serviceType');
    const dateId = dateSelect.value;
    
    if (!dateId) {
        typeSelect.innerHTML = '<option value="">— сначала выберите дату —</option>';
        return;
    }
    
    typeSelect.innerHTML = '<option value="">— загрузка... —</option>';
    
    try {
        console.log('🔄 Загрузка видов для даты ID:', dateId);
        const { data, error } = await supabase
            .from('date_service_types')
            .select('service_type_id, service_types(name, price_per_name, id)')
            .eq('date_id', dateId);
        
        if (error) {
            console.error('❌ Ошибка загрузки видов:', error);
            typeSelect.innerHTML = '<option value="">❌ Ошибка</option>';
            return;
        }
        
        console.log('✅ Загружено видов:', data?.length || 0);
        typeSelect.innerHTML = '<option value="">— выберите вид —</option>';
        data.forEach(item => {
            const st = item.service_types;
            if (st) {
                const opt = document.createElement('option');
                opt.value = st.id;
                opt.textContent = `${st.name} (${st.price_per_name} ₽/имя)`;
                opt.dataset.price = st.price_per_name;
                typeSelect.appendChild(opt);
            }
        });
        
        if (data.length === 0) {
            typeSelect.innerHTML = '<option value="">— нет доступных видов —</option>';
        }
        currentPricePerName = 0;
        updatePrice();
    } catch (e) {
        console.error('❌ Ошибка:', e);
        typeSelect.innerHTML = '<option value="">❌ Ошибка</option>';
    }
}

// ================================================================
// 6. ОТПРАВКА ЗАПИСКИ
// ================================================================

function getFormData() {
    const dateSelect = document.getElementById('serviceDate');
    const typeSelect = document.getElementById('serviceType');
    const names = getAllNames();
    
    const dateId = dateSelect.value;
    const serviceTypeId = typeSelect.value;
    const selectedOption = typeSelect.options[typeSelect.selectedIndex];
    const pricePerName = parseInt(selectedOption?.dataset?.price || 0);
    
    if (!dateId) {
        showMessage('userMessage', 'Выберите дату службы', 'error');
        return null;
    }
    if (!serviceTypeId) {
        showMessage('userMessage', 'Выберите вид поминовения', 'error');
        return null;
    }
    if (names.length === 0) {
        showMessage('userMessage', 'Введите хотя бы одно имя', 'error');
        return null;
    }
    
    const totalPrice = names.length * pricePerName;
    return { dateId, serviceTypeId, names, totalPrice, pricePerName };
}

async function saveNoteToSupabase(data, paid) {
    try {
        console.log('🔄 Сохранение записки:', data);
        const { error } = await supabase
            .from('notes')
            .insert({
                date_id: data.dateId,
                service_type_id: data.serviceTypeId,
                names: data.names,
                total_price: data.totalPrice,
                paid: paid
            });
        if (error) {
            console.error('❌ Ошибка сохранения:', error);
            throw error;
        }
        console.log('✅ Записка сохранена!');
        return true;
    } catch (e) {
        console.error('❌ Ошибка:', e);
        return false;
    }
}

async function submitWithPayment() {
    const data = getFormData();
    if (!data) return;
    
    showMessage('userMessage', '⏳ Сохранение...', 'info');
    const saved = await saveNoteToSupabase(data, false);
    if (!saved) {
        showMessage('userMessage', '❌ Ошибка сохранения. Проверьте подключение к Supabase.', 'error');
        return;
    }
    showPaymentModal(data);
}

async function submitWithoutPayment() {
    const data = getFormData();
    if (!data) return;
    
    showMessage('userMessage', '⏳ Сохранение...', 'info');
    const saved = await saveNoteToSupabase(data, false);
    if (!saved) {
        showMessage('userMessage', '❌ Ошибка сохранения. Проверьте подключение к Supabase.', 'error');
        return;
    }
    
    showMessage('userMessage', '✅ Записка принята! 🙏 Спаси Господи!', 'success');
    document.getElementById('serviceDate').value = '';
    document.getElementById('serviceType').innerHTML = '<option value="">— выберите вид —</option>';
    clearNameFields();
    document.getElementById('priceDisplay').textContent = 'Цена: 0 ₽';
    currentPricePerName = 0;
}

// ================================================================
// 7. ОКНО ОПЛАТЫ
// ================================================================

function showPaymentModal(data) {
    const overlay = document.getElementById('modalOverlay');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');
    
    title.textContent = '💳 Оплата записки';
    const namesList = data.names.map(n => `✟ ${n}`).join('<br>');

function toggleMode() {
    const userMode = document.getElementById('userMode');
    const adminMode = document.getElementById('adminMode');
    const btn = document.getElementById('toggleModeBtn');
    
    if (adminMode.classList.contains('active')) {
        adminMode.classList.remove('active');
        userMode.style.display = 'block';
        btn.textContent = '🔐 Вход для администратора';
    } else {
        const password = prompt('Введите пароль администратора:');
        if (password === ADMIN_PASSWORD) {
            adminMode.classList.add('active');
            userMode.style.display = 'none';
            btn.textContent = '🔓 Выйти из админки';
            refreshAdminData();
        } else if (password !== null) {
            alert('❌ Неверный пароль');
        }
    }
}

async function refreshAdminData() {
    const container = document.getElementById('adminContent');
    container.innerHTML = '<p style="text-align:center;">⏳ Загрузка...</p>';
    
    try {
        console.log('🔄 Загрузка данных для админа...');
        const { data: notes, error } = await supabase
            .from('notes')
            .select('*, service_dates(date), service_types(name, price_per_name)')
            .order('created_at', { ascending: false });
        
        if (error) {
            console.error('❌ Ошибка:', error);
            container.innerHTML = '<p style="color:#c62828;">❌ Ошибка загрузки</p>';
            return;
        }
        
        console.log('✅ Загружено записей:', notes?.length || 0);
        const datesMap = {};
        notes.forEach(n => {
            const dateStr = n.service_dates?.date || 'Без даты';
            if (!datesMap[dateStr]) datesMap[dateStr] = [];
            datesMap[dateStr].push(n);
        });
        
        const dates = Object.keys(datesMap).sort();
        const tabsContainer = document.getElementById('dateTabs');
        tabsContainer.innerHTML = '';
        dates.forEach(date => {
            const tab = document.createElement('button');
            tab.className = 'date-tab';
            tab.textContent = formatDate(date);
            tab.dataset.date = date;
            tab.onclick = function() {
                document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                renderAdminContent(date, datesMap[date]);
            };
            tabsContainer.appendChild(tab);
        });
        
        if (dates.length > 0) {
            const firstTab = tabsContainer.querySelector('.date-tab');
            if (firstTab) {
                firstTab.classList.add('active');
                renderAdminContent(dates[0], datesMap[dates[0]]);
            }
        } else {
            container.innerHTML = '<p style="color:#8a7a6a; text-align:center; padding:20px;">Пока нет записок</p>';
        }
    } catch (e) {
        console.error('❌ Ошибка:', e);
        container.innerHTML = '<p style="color:#c62828;">❌ Ошибка</p>';
    }
}

function renderAdminContent(date, notes) {
    const container = document.getElementById('adminContent');
    const typesMap = {};
    notes.forEach(n => {
        const typeName = n.service_types?.name || 'Неизвестный вид';
        if (!typesMap[typeName]) typesMap[typeName] = [];
        typesMap[typeName].push(n);
    });
    
    let html = '';
    for (const [type, items] of Object.entries(typesMap)) {
        const price = items[0]?.service_types?.price_per_name || 0;
        html += '<div class="service-section">';
        html += `<h4>✝ ${type} <span class="price-tag">${price} ₽/имя</span></h4>`;
        html += '<ul class="names-list">';
        const allNames = [];
        items.forEach(item => {
            item.names.forEach(name => {
                html += `<li>${name}</li>`;
                allNames.push(name);
            });
        });
        html += '</ul>';
        html += `<button class="copy-btn" onclick="window.copyNames('${allNames.join(', ')}')">
            📋 Копировать все (${allNames.length})
        </button>`;
        html += '</div>';
    }
    
    if (html === '') {
        html = '<p style="color:#8a7a6a; text-align:center; padding:20px;">Нет записок</p>';
    }
    container.innerHTML = html;
}

function copyNames(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('✅ Имена скопированы!');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        alert('✅ Имена скопированы!');
    });
}

async function addNewServiceType() {

    try {

        if (error) throw error;

        closeModal();
        loadServiceTypes();
        refreshAdminData();

async function manageDateServices() {
    const overlay = document.getElementById('modalOverlay');
    const title = document.getElementById('modalTitle');
    const body = document.getElementById('modalBody');
    
    title.textContent = '📌 Назначить виды на дату';
    
    const { data: dates } = await supabase.from('service_dates').select('*').order('date');
    const { data: types } = await supabase.from('service_types').select('*').order('name');
    
    let html = `
        <div class="field-group">
            <label>Дата:</label>
            <select id="manageDateSelect" style="width:100%; padding:12px; border:1px solid #d4c4a8; border-radius:8px; font-size:16px;">
                <option value="">— выберите —</option>
    `;
    dates.forEach(d => {
        html += `<option value="${d.id}">${formatDate(d.date)}</option>`;
    });
    html += `</select></div>
        <div class="field-group">
            <label>Виды:</label>
            <div id="manageTypesContainer">
    `;
    types.forEach(t => {
        html += `
            <div style="display:flex; align-items:center; gap:8px; margin:4px 0;">
                <input type="checkbox" id="type_${t.id}" value="${t.id}">
                <label for="type_${t.id}">${t.name} (${t.price_per_name} ₽)</label>
            </div>
        `;
    });
    html += `</div></div>
        <button class="btn btn-primary" onclick="window.saveDateServices()">💾 Сохранить</button>
        <button class="btn btn-secondary" onclick="window.closeModal()">Отмена</button>
    `;
    
    body.innerHTML = html;
    overlay.classList.add('active');
    
    document.getElementById('manageDateSelect').onchange = async function() {
        const dateId = this.value;
        if (!dateId) return;
        const { data: links } = await supabase
            .from('date_service_types')
            .select('service_type_id')
            .eq('date_id', dateId);
        const linkedIds = links.map(l => l.service_type_id);
        document.querySelectorAll('#manageTypesContainer input[type="checkbox"]').forEach(cb => {
            cb.checked = linkedIds.includes(parseInt(cb.value));
        });
    };
}

async function saveDateServices() {
    const dateId = document.getElementById('manageDateSelect').value;
    if (!dateId) { alert('Выберите дату'); return; }
    
    const checked = [];
    document.querySelectorAll('#manageTypesContainer input[type="checkbox"]:checked').forEach(cb => {
        checked.push(parseInt(cb.value));
    });
    
    try {
        await supabase.from('date_service_types').delete().eq('date_id', dateId);
        if (checked.length > 0) {
            const inserts = checked.map(typeId => ({ date_id: dateId, service_type_id: typeId }));
            const { error } = await supabase.from('date_service_types').insert(inserts);
            if (error) throw error;
        }
        alert('✅ Сохранено!');
        closeModal();
        loadServiceTypes();
    } catch (e) {
        alert('❌ Ошибка: ' + e.message);
    }
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
}

function showMessage(elementId, text, type) {
    const el = document.getElementById(elementId);
    el.className = 'message ' + type;
    el.innerHTML = text;
    el.style.display = 'block';
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => { el.style.display = 'none'; }, 8000);
}
